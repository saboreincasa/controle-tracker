<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Criar senha · Controle do Tracker</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#eef1f6;--s:#fff;--l:#d9dfea;--fg:#141b2b;--m:#5b6579;--a:#1d4aa0;--ok:#17804a;--bad:#b4232c}
@media (prefers-color-scheme:dark){:root{--bg:#0d121c;--s:#151c2a;--l:#2a3447;--fg:#e8edf6;--m:#97a2b8;--a:#7ea6f2;--ok:#5cc98c;--bad:#f2777e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
form{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:20px;width:100%;max-width:380px;display:grid;gap:12px}
h1{margin:0;font-size:1.5rem}p{margin:0;color:var(--m);font-size:.88rem}
label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--m)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:10px}
button{font:600 .95rem system-ui;background:var(--a);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
#msg{font-size:.9rem;min-height:1.3em}a{color:var(--a);font-weight:600}
</style></head><body>
<form id="f">
  <h1>Criar senha nova</h1>
  <p>Use o código de uso único que o Claude te passou. A senha nova vale para o Controle do Tracker e para o sistema da Sabore (é o mesmo login).</p>
  <label for="c">Código<input id="c" autocomplete="one-time-code" required style="text-transform:uppercase;letter-spacing:.15em"></label>
  <label for="s1">Senha nova (mínimo 8 caracteres)<input id="s1" type="password" minlength="8" autocomplete="new-password" required></label>
  <label for="s2">Repita a senha<input id="s2" type="password" minlength="8" autocomplete="new-password" required></label>
  <button type="submit" id="b">Salvar senha</button>
  <div id="msg"></div>
</form>
<script>
const URL_="https://hzkmhtfwulxvysorvcjb.supabase.co",KEY="sb_publishable_7MOAsg_uX2o-oAXiqPEhUQ_dXlNhTu4";
const $=i=>document.getElementById(i),m=(t,c)=>{$("msg").innerHTML=t;$("msg").style.color=c};
$("f").addEventListener("submit",async e=>{e.preventDefault();
  if($("s1").value!==$("s2").value){m("As senhas não são iguais.","var(--bad)");return}
  $("b").disabled=true;m("Salvando…","var(--m)");
  try{const r=await fetch(URL_+"/rest/v1/rpc/carro_definir_senha",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({p_codigo:$("c").value,p_senha:$("s1").value})});
    const t=await r.json();
    if(t==="ok"){m('Senha criada! <a href="./">Entrar no app</a>',"var(--ok)");$("f").reset()}
    else if(t==="senha_curta")m("A senha precisa ter pelo menos 8 caracteres.","var(--bad)");
    else m("Código inválido ou vencido. Peça um código novo ao Claude.","var(--bad)");
  }catch(_){m("Sem conexão. Tente de novo.","var(--bad)")}
  $("b").disabled=false});
</script>
</body></html>
